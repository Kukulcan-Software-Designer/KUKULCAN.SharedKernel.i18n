name: Domain Unit Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  domain-unit-tests:
    name: Build and test Domain.UnitTests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Tests/KUKULCAN.SharedKernel.i18n.Domain.UnitTests/KUKULCAN.SharedKernel.i18n.Domain.UnitTests.csproj

      - name: Build
        run: dotnet build Tests/KUKULCAN.SharedKernel.i18n.Domain.UnitTests/KUKULCAN.SharedKernel.i18n.Domain.UnitTests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Tests/KUKULCAN.SharedKernel.i18n.Domain.UnitTests/KUKULCAN.SharedKernel.i18n.Domain.UnitTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

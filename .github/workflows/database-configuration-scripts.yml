name: Database Configuration Scripts

on:
  push:
    branches:
      - "FEATURES/DATABASE-CONFIGURATION-SCRIPTS"
  pull_request:
    branches:
      - Develop

jobs:
  validate-scripts:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            script: Documentation/Scripts/configure-database-linux.sh
            shell: bash
          - os: macos-latest
            script: Documentation/Scripts/configure-database-macos.sh
            shell: bash
          - os: windows-latest
            script: Documentation/Scripts/Configure-Database-Windows.ps1
            shell: pwsh

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Bash script exists
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -f "${{ matrix.script }}"

      - name: Verify PowerShell script exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ matrix.script }}")) {
            throw "Required script not found: ${{ matrix.script }}"
          }

      - name: Validate Bash script
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n "${{ matrix.script }}"
          grep -Fq "KUKULCAN__DATABASE__CONNECTIONSTRING" "${{ matrix.script }}"
          grep -Fq "KUKULCAN__DATABASE__PROVIDER" "${{ matrix.script }}"
          grep -Fq "dotnet ef database update" "${{ matrix.script }}"
          grep -Fq "dotnet tool install --global dotnet-ef" "${{ matrix.script }}"
          if grep -Fq -- "--startup-project" "${{ matrix.script }}"; then
            echo "Database migration scripts must use the migration project design-time factory and must not start the API." >&2
            exit 1
          fi
          grep -Fq "KUKULCAN.SharedKernel.i18n.Migrations.SqlServer" "${{ matrix.script }}"
          grep -Fq "KUKULCAN.SharedKernel.i18n.Migrations.PostgreSql" "${{ matrix.script }}"
          grep -Fq "KUKULCAN.SharedKernel.i18n.Migrations.MySql" "${{ matrix.script }}"
          grep -Fq "Salir sin registrar las variables" "${{ matrix.script }}"
          grep -Fq "SqlServer" "${{ matrix.script }}"
          grep -Fq "PostgresSql" "${{ matrix.script }}"
          grep -Fq "MySql" "${{ matrix.script }}"

      - name: Test Linux database configuration flow
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash Tests/Scripts/configure-database-linux.test.sh

      - name: Test macOS database configuration flow
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash Tests/Scripts/configure-database-macos.test.sh

      - name: Test Linux password Enter handling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash Tests/Scripts/configure-database-linux-enter.test.sh

      - name: Test macOS password Enter handling
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash Tests/Scripts/configure-database-macos-enter.test.sh

      - name: Validate PowerShell script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $content = Get-Content "${{ matrix.script }}" -Raw
          [System.Management.Automation.Language.Parser]::ParseInput(
            $content,
            [ref]$null,
            [ref]$null
          ) | Out-Null
          if ($content -notmatch 'KUKULCAN__DATABASE__CONNECTIONSTRING') { throw 'Missing EF Core connection variable' }
          if ($content -notmatch 'KUKULCAN__DATABASE__PROVIDER') { throw 'Missing EF Core provider variable' }
          if ($content -notmatch 'dotnet ef database update') { throw 'Missing EF Core database update command' }
          if ($content -notmatch 'dotnet tool install --global dotnet-ef') { throw 'Missing EF Core tool installation' }
          if ($content -match '--startup-project') { throw 'Database migration scripts must not start the API project.' }
          if ($content -notmatch 'KUKULCAN.SharedKernel.i18n.Migrations.SqlServer') { throw 'Missing SQL Server migrations project' }
          if ($content -notmatch 'KUKULCAN.SharedKernel.i18n.Migrations.PostgreSql') { throw 'Missing PostgreSQL migrations project' }
          if ($content -notmatch 'KUKULCAN.SharedKernel.i18n.Migrations.MySql') { throw 'Missing MySQL migrations project' }
          if ($content -notmatch 'Salir sin registrar las variables') { throw 'Missing exit option text' }
          if ($content -notmatch 'SqlServer') { throw 'Missing SQL Server provider' }
          if ($content -notmatch 'PostgresSql') { throw 'Missing PostgreSQL provider' }
          if ($content -notmatch 'MySql') { throw 'Missing MySQL provider' }
